<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Blog - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-panel { max-width: 420px; margin: 12vh auto; }
    .login-panel input { margin: 12px 0; }
    .login-panel button { width: 100%; }
  </style>
</head>
<body>
  <main class="panel login-panel">
    <h1>Micro Blog</h1>
    <p class="hint">Enter your username to continue.</p>
    <form id="loginForm">
      <input type="text" id="username" maxlength="25" placeholder="Your username" required>
      <button type="submit">Login</button>
    </form>
    <p id="error" class="message"></p>
  </main>
  <script src="login.js"></script>
</body>
</html>
